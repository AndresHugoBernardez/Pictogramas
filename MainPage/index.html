<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escritor de Pictogramas Avanzado</title>
    <style>
        @font-face {
            font-family: 'DynamicPictogramFont';
            src: url('https://AndresHugoBernardez.github.io/pagesAB/PictoWriter/ScleraFont.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
        }

        .main-container {
            max-width: 56rem;
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            border: 1px solid #e2e8f0;
        }

        header {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.875rem;
            line-height: 2.25rem;
            font-weight: 800;
            color: #4f46e5;
        }

        header p {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            outline: none;
            font-size: 1.125rem;
            transition: all 0.2s ease;
            resize: vertical;
            font-family: inherit;
        }

        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #475569;
            margin-bottom: 0.75rem;
        }

        #outputContainer {
            min-height: 160px;
            padding: 1.5rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            align-content: flex-start;
        }

        .empty-placeholder {
            color: #94a3b8;
            font-style: italic;
        }

        .picto-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.5rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: border-color 0.2s ease;
        }

        .picto-wrapper:hover {
            border-color: #818cf8;
        }

        .picto-box {
            font-family: 'DynamicPictogramFont', sans-serif;
            font-size: 2.25rem;
            color: #4338ca;
            height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            user-select: none;
        }

        .picto-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
            font-weight: 500;
        }

        .picto-dropdown {
            position: absolute;
            bottom: 100%;
            margin-bottom: 0rem;
            display: none;
            flex-wrap: wrap;
            gap: 0.25rem;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 0.5rem;
            padding: 0.5rem;
            z-index: 25;
            max-width: 20rem;
            max-height: 12rem;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        /* Estilo personalizado para la barra de desplazamiento del desplegable */
        .picto-dropdown::-webkit-scrollbar {
            width: 6px;
        }

        .picto-dropdown::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        .picto-dropdown::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .picto-dropdown::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .picto-wrapper:hover .picto-dropdown {
            display: flex;
        }

        .opt-btn {
            font-family: 'DynamicPictogramFont', sans-serif;
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 0.25rem;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .opt-btn:hover {
            background-color: #eef2ff;
            border-color: #a5b4fc;
        }

        .spacer {
            width: 0.5rem;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-6">

    <div class="main-container">
        <header>
            <h1>Escritor de Pictogramas</h1>
            <p>Escribe texto y visualiza los pictogramas correspondientes. Pasa el cursor sobre un pictograma con opciones para desplegar sinónimos o variantes.</p>
        </header>

        <!-- Área de Escritura -->
        <div class="input-group">
            <label for="textInput">Texto de entrada:</label>
            <textarea id="textInput" rows="4" placeholder="Escribe aquí tu frase... (ej. Hola, ¿cómo estás?)"></textarea>
        </div>

        <!-- Contenedor de Pictogramas Resultantes -->
        <div>
            <h2 class="section-title">Pictogramas Generados:</h2>
            <div id="outputContainer">
                <span class="empty-placeholder">Los pictogramas aparecerán aquí mientras escribes...</span>
            </div>
        </div>
    </div>

    <script>
        let pictogramData = {}; 
        let DictionaryData= {};
        const customFontName = 'DynamicPictogramFont';

        // 1. Carga automática inicial por defecto
        async function loadDefaults() {
            try {
                const response = await fetch('https://andreshugobernardez.github.io/pagesAB/PictoWriter/sclera_map.json');
                if (response.ok) {
                    pictogramData = await response.json();
                    console.log("JSON por defecto cargado exitosamente. Claves totales:", Object.keys(pictogramData).length);
                }
            } catch (e) {
                console.log("Nota: Carga automática de JSON omitida.");
            }

            try {
                const response = await fetch('https://andreshugobernardez.github.io/pagesAB/PictoWriter/sclera_sintagmas_map.json');
                if (response.ok) {
                    sintagmaData = await response.json();
                    console.log("JSON Sintagmas MAP por defecto cargado exitosamente. Claves totales:", Object.keys(sintagmaData).length);
                }
            } catch (e) {
                console.log("Nota: Carga automática de JSON omitida.");
            }

            try {
                const response = await fetch('https://andreshugobernardez.github.io/pagesAB/PictoWriter/dict2.json');
                if (response.ok) {
                    DictionaryData = await response.json();
                    console.log("Diccionario cargado", Object.keys(DictionaryData).length);
                }
            } catch (e) {
                console.log("Nota: Carga de diccionario fallido");
            }
        }

        // Procesar escritura en tiempo real
        document.getElementById('textInput').addEventListener('input', renderPictograms);

        function extractOptions(entry) {
            if (!entry) return [];
            if (Array.isArray(entry)) {
                return entry.map(item => typeof item === 'object' ? (item.char || item.value || JSON.stringify(item)) : String(item));
            }
            if (typeof entry === 'object') {
                return [entry.char || entry.value || JSON.stringify(entry)];
            }
            return [String(entry)];
        }

        function renderPictograms() {
            const text = document.getElementById('textInput').value;
            const container = document.getElementById('outputContainer');
            container.innerHTML = '';

            if (!text.trim()) {
                container.innerHTML = '<span class="empty-placeholder">Los pictogramas aparecerán aquí mientras escribes...</span>';
                return;
            }

            const tokens = text.match(/([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9]+|[^a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\s]|\s+)/g) || [];

            if(tokens.length > 0) {
                for(let i = 0; i < tokens.length; i++) {
                    let options = [];
                    let token = tokens[i];
                    const cleanToken = token.toLowerCase().trim();

                    if (!cleanToken) {
                        const spaceSpan = document.createElement('span');
                        spaceSpan.className = 'spacer';
                        container.appendChild(spaceSpan);
                        continue;
                    }

                    const wrapper = document.createElement('div');
                    wrapper.className = 'picto-wrapper';

                    const pictoBox = document.createElement('div');
                    pictoBox.className = 'picto-box';

                    const labelBox = document.createElement('span');
                    labelBox.className = 'picto-label';
                    labelBox.textContent = token;

                    if (pictogramData[cleanToken]) {
                        options = extractOptions(pictogramData[cleanToken]);
                    }

                    // Solo añade sinónimos si no encontró la palabra exacta.
                    if(options.length == 0) {
                        let synonymsWords = [];
                        let sinonimos = "";
                        let uniqueSynonyms = [];

                        if(DictionaryData[cleanToken]){
                            sinonimos = DictionaryData[cleanToken].synonyms;
                            synonymsWords = sinonimos.split(',').map(p => p.trim());

                            synonymsWords.forEach(palabra => {
                                if (!uniqueSynonyms.includes(palabra) && palabra !== "") {
                                    uniqueSynonyms.push(palabra);
                                }
                            });
                        }

                        if(uniqueSynonyms.length > 0){
                            uniqueSynonyms.forEach(palabra => {
                                if (pictogramData[palabra]) {
                                    options.push(...extractOptions(pictogramData[palabra]));
                                }
                            });
                        }
                    }

                    let activeChar = options.length > 0 ? String.fromCodePoint(parseInt(options[0], 16)) : token; 
                    pictoBox.textContent = activeChar;

                    wrapper.appendChild(pictoBox);
                    wrapper.appendChild(labelBox);

                    if (options.length > 1) {
                        const dropdown = document.createElement('div');
                        dropdown.className = 'picto-dropdown';

                        options.forEach(opt => {
                            const optBtn = document.createElement('button');
                            optBtn.className = 'opt-btn';
                            optBtn.textContent = String.fromCodePoint(parseInt(opt, 16));
                            optBtn.title = "Seleccionar esta variante";
                            optBtn.onclick = (e) => {
                                e.stopPropagation();
                                activeChar = optBtn.textContent;
                                pictoBox.textContent = activeChar;
                            };
                            dropdown.appendChild(optBtn);
                        });

                        wrapper.appendChild(dropdown);
                    }

                    container.appendChild(wrapper);
                }
            }
        }

        loadDefaults();
    </script>
</body>
</html>
