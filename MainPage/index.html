<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escritor de Pictogramas Avanzado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'DynamicPictogramFont';
            src: url('https://AndresHugoBernardez.github.io/pagesAB/PictoWriter/ScleraFont.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        .picto-font {
            font-family: 'DynamicPictogramFont', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-6">

    <div class="max-w-4xl w-full bg-white shadow-xl rounded-2xl p-8 border border-slate-200">
        <header class="mb-6 border-b pb-4">
            <h1 class="text-3xl font-extrabold text-indigo-600">Escritor de Pictogramas</h1>
            <p class="text-sm text-slate-500 mt-1">Escribe texto y visualiza los pictogramas correspondientes. Pasa el cursor sobre un pictograma con opciones para desplegar sinónimos o variantes.</p>
        </header>

        <!-- Panel de Configuración y Carga de Archivos -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Cargar Fuente (.woff2 / .ttf)</label>
                <input type="file" id="fontFile" accept=".woff2,.woff,.ttf" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Cargar Base de Datos JSON</label>
                <input type="file" id="jsonFile" accept=".json" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
            </div>
        </div>

        <!-- Área de Escritura -->
        <div class="mb-6">
            <label for="textInput" class="block text-sm font-medium text-slate-700 mb-2">Texto de entrada:</label>
            <textarea id="textInput" rows="4" placeholder="Escribe aquí tu frase... (ej. Hola, ¿cómo estás?)" class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-lg transition"></textarea>
        </div>

        <!-- Contenedor de Pictogramas Resultantes -->
        <div>
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-600 mb-3">Pictogramas Generados:</h2>
            <div id="outputContainer" class="min-h-[160px] p-6 bg-slate-50 border border-slate-200 rounded-xl flex flex-wrap gap-4 items-center content-start">
                <span class="text-slate-400 italic">Los pictogramas aparecerán aquí mientras escribes...</span>
            </div>
        </div>
    </div>

    <script>
        let pictogramData = {}; 
		let DictionaryData= {};
        const customFontName = 'DynamicPictogramFont';

        // 1. Carga automática inicial por defecto (si se usa servidor local)
        async function loadDefaults() {
            try {
                const response = await fetch('https://andreshugobernardez.github.io/pagesAB/PictoWriter/sclera_map.json');
                if (response.ok) {
                    pictogramData = await response.json();
                    console.log("JSON por defecto cargado exitosamente. Claves totales:", Object.keys(pictogramData).length);
                }
            } catch (e) {
                console.log("Nota: Carga automática de JSON omitida (ejecutando desde disco local o archivo no encontrado). Usa el selector superior.");
            }
            		// 1.b Carga de diccionario
		
	        try {
                const response = await fetch('https://andreshugobernardez.github.io/pagesAB/PictoWriter/dict2.json');
                if (response.ok) {
                    DictionaryData = await response.json();
                    console.log("Diccionario cargado", Object.keys(DictionaryData).length);
                }
            } catch (e) {
                console.log("Nota: Carga de diccionario fallido");
            }

        
        }


        // 2. Manejar carga de fuente personalizada con FontFace API
        document.getElementById('fontFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const fontUrl = URL.createObjectURL(file);
                const newFontFace = new FontFace(customFontName, `url(${fontUrl})`);
                
                newFontFace.load().then(function(loadedFace) {
                    document.fonts.add(loadedFace);
                    console.log("Fuente cargada y registrada en document.fonts:", customFontName);
                    alert("¡Fuente cargada correctamente!");
                    renderPictograms();
                }).catch(function(error) {
                    console.error("Error al cargar la fuente:", error);
                    alert("Error al cargar la fuente: " + error);
                });
            }
        });

        // 3. Manejar carga de JSON personalizado
        document.getElementById('jsonFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        pictogramData = JSON.parse(e.target.result);
                        console.log("Base de datos JSON cargada. Claves totales:", Object.keys(pictogramData).length);
                        alert("¡Base de datos JSON cargada correctamente!");
                        renderPictograms();
                    } catch (err) {
                        console.error("Error al parsear JSON:", err);
                        alert("El archivo JSON no es válido.");
                    }
                };
                reader.readAsText(file);
            }
        });

        // 4. Procesar escritura en tiempo real
        document.getElementById('textInput').addEventListener('input', renderPictograms);

        function extractOptions(entry) {
            if (!entry) return [];
            if (Array.isArray(entry)) {
                return entry.map(item => typeof item === 'object' ? (item.char || item.value || JSON.stringify(item)) : String(item));
            }
            if (typeof entry === 'object') {
                return [entry.char || entry.value || JSON.stringify(entry)];
            }
            return [String(entry)];
        }

        function renderPictograms() {
            const text = document.getElementById('textInput').value;
            const container = document.getElementById('outputContainer');
            container.innerHTML = '';

            if (!text.trim()) {
                container.innerHTML = '<span class="text-slate-400 italic">Los pictogramas aparecerán aquí mientras escribes...</span>';
                return;
            }

            const tokens = text.match(/([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9]+|[^a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\s]|\s+)/g) || [];
  

           

            tokens.forEach(token => {
                const cleanToken = token.toLowerCase().trim();

      
                if (!cleanToken) {
                    const spaceSpan = document.createElement('span');
                    spaceSpan.className = 'w-2';
                    container.appendChild(spaceSpan);
                    return;
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'relative group flex flex-col items-center bg-white border border-slate-200 rounded-lg p-2 shadow-sm hover:border-indigo-400 transition';

                const pictoBox = document.createElement('div');
                // Corrección clave para aplicar la fuente correctamente
                pictoBox.style.fontFamily = `'${customFontName}', sans-serif`;
                pictoBox.className = 'text-4xl text-indigo-700 h-14 flex items-center justify-center min-w-[50px] select-none';

                const labelBox = document.createElement('span');
                labelBox.className = 'text-xs text-slate-500 mt-1 font-medium';
                labelBox.textContent = token;
                


                let options = [];
				
				
                if (pictogramData[cleanToken]) {
                    options = extractOptions(pictogramData[cleanToken]);
        
                  
                }



                
                let synonymsWords = [];
                let sinonimos="";
                 let  uniqueSynonyms = [];

                if(DictionaryData[cleanToken]){
                
                        //Extraer string de DictionaryData[cleanToken].synonyms
                        sinonimos= DictionaryData[cleanToken].synonyms;
                        //Dividir string sinonimos en palabras...
                        synonymsWords =  sinonimos.split(',').map(p => p.trim());

           

                    
                       //console.log("palabras:")
                        synonymsWords.forEach(palabra => {
                            if (!uniqueSynonyms.includes(palabra) && palabra !== "") {
                                uniqueSynonyms.push(palabra);
                                //console.log(palabra);
                                
                
                            
                            }
                        });
                        
                }

                // Solo añade sinónimos si no encontró la palabra exacta.
                if(options.length==0){
                    if(uniqueSynonyms.length>0){
                  uniqueSynonyms.forEach(palabra =>{
                                if (pictogramData[palabra]) {
                                    options.push(...extractOptions(pictogramData[palabra]));
                                
                                    
                                     
                                }
                        });
                    }

                }


                // Si no hay mapeo en el JSON, mostramos el token original como respaldo para ver si la fuente afecta a los caracteres
                let activeChar = options.length > 0 ? String.fromCodePoint(parseInt(options[0], 16)) : token; 

                
             
                pictoBox.textContent = activeChar;

                wrapper.appendChild(pictoBox);
                wrapper.appendChild(labelBox);

                if (options.length > 1) {
                    const dropdown = document.createElement('div');
                    dropdown.className = 'absolute bottom-full mb-2 hidden group-hover:flex flex-wrap gap-1 bg-white border border-slate-300 shadow-lg rounded-lg p-2 z-25 max-w-xs';

                    
                    options.forEach(opt => {
                        const optBtn = document.createElement('button');
                        optBtn.style.fontFamily = `'${customFontName}', sans-serif`;
                        optBtn.className = 'text-2xl p-2 hover:bg-indigo-50 rounded border border-transparent hover:border-indigo-300 transition';
                        optBtn.textContent = String.fromCodePoint(parseInt(opt, 16));
                        optBtn.title = "Seleccionar esta variante";
                        optBtn.onclick = (e) => {
                            e.stopPropagation();
                            activeChar=optBtn.textContent;
                            pictoBox.textContent=activeChar;
                       
                        };
                        dropdown.appendChild(optBtn);
                    });

                    wrapper.appendChild(dropdown);
                }
				

                container.appendChild(wrapper);
            });
        }

        loadDefaults();
    </script>
</body>
</html>
